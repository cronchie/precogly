services:
  db:
    # Only containers on the compose network can reach Postgres
    ports: !reset []

  backend:
    build:
      # No context here: compose merges `build` key by key, so the base file's
      # `context: .` and `dockerfile:` carry over and only the target differs.
      target: prod
    # Remove the dev source mounts so gunicorn serves the code built into the image
    volumes: !reset []
    ports: !reset []
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-precogly}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-precogly}
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

  # Compose can't delete a service defined in docker-compose.yml. With the dev
  # profile, Compose starts the LM Studio forwarder only when someone passes
  # --profile dev.
  lmstudio-proxy:
    profiles: ["dev"]

  frontend:
    build:
      context: ./frontend
      target: prod
    volumes: !reset []
    # Loopback only: Caddy on the host owns 80/443, terminates TLS and proxies here
    ports: !override
      - "127.0.0.1:8080:80"
    environment: {}
